name: Deploy AWS DevOps API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  DEPLOY_BUCKET: devops-api-deploy-785060333737
  DEPLOY_PREFIX: deployments
  ASG_NAME: devops-api-asg
  APP_DIR: /home/ssm-user/example-repo
  SERVICE_NAME: devops-api.service
  SECRET_NAME: devops/rds/postgres
  NODE_BIN: /home/ssm-user/versions/node/v20.20.2/bin

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present


  # ============================================================
  # 2. PACKAGE
  # ============================================================

  package:
    name: Create Deployment Package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='uploads/*' \
            --exclude='.github' \
            -czf /tmp/deployment.tar.gz .

          mv /tmp/deployment.tar.gz deployment.tar.gz

          echo "Deployment package created:"
          ls -lh deployment.tar.gz

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.tar.gz


  # ============================================================
  # 3. DEPLOY
  # ============================================================

  deploy:
    name: Deploy to AWS
    needs: package
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Download package created by package job
      # ----------------------------------------------------------

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      # ----------------------------------------------------------
      # Configure AWS OIDC
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::785060333737:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      # ----------------------------------------------------------
      # Upload package to S3
      # ----------------------------------------------------------

      - name: Upload package to S3
        run: |
          aws s3 cp \
            deployment.tar.gz \
            s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/${GITHUB_SHA}.tar.gz

          echo "Uploaded deployment:"
          echo "s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/${GITHUB_SHA}.tar.gz"

      # ----------------------------------------------------------
      # Find running ASG instances
      # ----------------------------------------------------------

      - name: Get ASG instances
        id: instances
        shell: bash
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${ASG_NAME}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "ERROR: No InService ASG instances found."
            exit 1
          fi

          echo "ASG instances:"
          echo "$INSTANCE_IDS"

          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Deploy application to all EC2 instances
      # ----------------------------------------------------------

      - name: Deploy application to EC2
        id: deployment
        shell: bash
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.instances.outputs.instance_ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",
              "export DEBIAN_FRONTEND=noninteractive",
              "export PATH=/home/ssm-user/versions/node/v20.20.2/bin:$PATH",

              "echo Starting deployment",

              "if ! command -v aws >/dev/null 2>&1; then apt-get update -y && apt-get install -y awscli; fi",

              "echo Downloading deployment package",

              "aws s3 cp s3://devops-api-deploy-785060333737/deployments/'${GITHUB_SHA}'.tar.gz /tmp/'${GITHUB_SHA}'.tar.gz",

              "echo Downloading database secret",

              "aws secretsmanager get-secret-value --secret-id devops/rds/postgres --query SecretString --output text > /tmp/db-secret.json",

              "echo Creating database environment file",

              "python3 -c '\''import json; d=json.load(open(\"/tmp/db-secret.json\")); open(\"/etc/devops-api.env\",\"w\").write(\"DB_HOST=\" + d[\"DB_HOST\"] + \"\\nDB_PORT=\" + d[\"DB_PORT\"] + \"\\nDB_USER=\" + d[\"DB_USER\"] + \"\\nDB_NAME=\" + d[\"DB_NAME\"] + \"\\nDB_PASSWORD=\" + d[\"DB_PASSWORD\"] + \"\\n\")'\''",

              "chmod 600 /etc/devops-api.env",

              "rm -f /tmp/db-secret.json",

              "echo Preparing application directory",

              "mkdir -p /home/ssm-user/example-repo/uploads",

              "find /home/ssm-user/example-repo -mindepth 1 -maxdepth 1 ! -name uploads -exec rm -rf {} +",

              "echo Extracting deployment package",

              "tar -xzf /tmp/'${GITHUB_SHA}'.tar.gz -C /home/ssm-user/example-repo",

              "chown -R ssm-user:ssm-user /home/ssm-user/example-repo",

              "echo Installing production dependencies",

              "cd /home/ssm-user/example-repo && npm ci --omit=dev",

              "rm -f /tmp/'${GITHUB_SHA}'.tar.gz",

              "echo Application deployment completed"
            ]' \
            --max-concurrency "100%" \
            --max-errors "0" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM deployment command:"
          echo "$COMMAND_ID"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Wait for deployment on all EC2 instances
      # ----------------------------------------------------------

      - name: Wait for EC2 deployment
        shell: bash
        run: |

          COMMAND_ID="${{ steps.deployment.outputs.command_id }}"
          INSTANCE_IDS="${{ steps.instances.outputs.instance_ids }}"

          EXPECTED=$(echo "$INSTANCE_IDS" | wc -w)

          echo "Waiting for $EXPECTED instances..."

          for i in {1..60}; do

            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[].Status' \
              --output text || true)

            echo "Deployment status: $STATUSES"

            if echo "$STATUSES" | grep -Eq \
              'Failed|TimedOut|Cancelled|Undeliverable|Terminated|AccessDenied|InvalidPlatform'; then

              echo "Deployment failed."

              echo "Fetching command output..."

              for INSTANCE_ID in $INSTANCE_IDS; do

                echo "=========================================="
                echo "Instance: $INSTANCE_ID"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
                  --output json || true

              done

              exit 1
            fi

            ACTUAL=$(echo "$STATUSES" | wc -w)

            if [ "$ACTUAL" -eq "$EXPECTED" ] && \
               ! echo "$STATUSES" | grep -Eq 'Pending|InProgress|Delayed|Cancelling'; then

              echo "All EC2 deployments completed successfully."

              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Deployment timed out."
              exit 1
            fi

            sleep 5

          done


      # ==========================================================
      # 4. DATABASE MIGRATION
      # ==========================================================

      - name: Run database migration
        shell: bash
        run: |

          FIRST_INSTANCE=$(echo "${{ steps.instances.outputs.instance_ids }}" | awk '{print $1}')

          echo "Running migration on:"
          echo "$FIRST_INSTANCE"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$FIRST_INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Database migration ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",
              "export PATH=/home/ssm-user/versions/node/v20.20.2/bin:$PATH",
              "set -a",
              ". /etc/devops-api.env",
              "set +a",
              "cd /home/ssm-user/example-repo",
              "npm run db:migrate"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Migration command:"
          echo "$COMMAND_ID"

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$FIRST_INSTANCE" \
              --query 'Status' \
              --output text || true)

            echo "Migration status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo "Database migration completed."

              exit 0

            fi

            if echo "$STATUS" | grep -Eq \
              'Failed|TimedOut|Cancelled|Undeliverable|Terminated|AccessDenied|InvalidPlatform'; then

              echo "Database migration failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$FIRST_INSTANCE" \
                --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
                --output json || true

              exit 1

            fi

            sleep 5

          done

          echo "Migration timed out."
          exit 1


      # ==========================================================
      # 5. RESTART APPLICATION
      # ==========================================================

      - name: Restart application
        shell: bash
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.instances.outputs.instance_ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "Restart API ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",

              "echo Restarting application",

              "systemctl restart devops-api.service",

              "sleep 5",

              "systemctl is-active --quiet devops-api.service",

              "echo Checking local health",

              "curl -fsS http://127.0.0.1:3000/health",

              "echo",

              "echo Application restart successful"
            ]' \
            --max-concurrency "100%" \
            --max-errors "0" \
            --query 'Command.CommandId' \
            --output text)

          echo "Restart command:"
          echo "$COMMAND_ID"

          for i in {1..30}; do

            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[].Status' \
              --output text || true)

            echo "Restart status: $STATUSES"

            if echo "$STATUSES" | grep -Eq \
              'Failed|TimedOut|Cancelled|Undeliverable|Terminated|AccessDenied|InvalidPlatform'; then

              echo "Application restart failed."

              for INSTANCE_ID in ${{ steps.instances.outputs.instance_ids }}; do

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
                  --output json || true

              done

              exit 1
            fi

            EXPECTED=$(echo "${{ steps.instances.outputs.instance_ids }}" | wc -w)
            ACTUAL=$(echo "$STATUSES" | wc -w)

            if [ "$ACTUAL" -eq "$EXPECTED" ] && \
               ! echo "$STATUSES" | grep -Eq 'Pending|InProgress|Delayed|Cancelling'; then

              echo "Application restarted successfully."

              break
            fi

            sleep 5

          done


      # ==========================================================
      # 6. ALB HEALTH CHECK
      # ==========================================================

      - name: Check ALB health
        shell: bash
        run: |

          ALB_URL="http://devops-api-alb-526360884.us-east-2.elb.amazonaws.com/health"

          echo "Checking:"
          echo "$ALB_URL"

          for i in {1..12}; do

            if curl -fsS "$ALB_URL"; then

              echo
              echo "=========================================="
              echo "Deployment successful!"
              echo "=========================================="

              exit 0

            fi

            echo "ALB not ready yet..."
            sleep 5

          done

          echo "ALB health check failed."

          exit 1