name: Deploy AWS DevOps API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  DEPLOY_BUCKET: devops-api-deploy-785060333737
  DEPLOY_PREFIX: deployments
  ASG_NAME: devops-api-asg
  APP_DIR: /home/ssm-user/example-repo
  SERVICE_NAME: devops-api.service

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='uploads/*' \
            --exclude='.github' \
            -czf deployment.tar.gz .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.tar.gz

  deploy:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::785060333737:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Upload package to S3
        run: |
          aws s3 cp \
            deployment.tar.gz \
            s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/${GITHUB_SHA}.tar.gz

      - name: Get ASG instances
        id: instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${ASG_NAME}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No InService instances found."
            exit 1
          fi

          echo "Instances: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy application to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.instances.outputs.instance_ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",
              "export PATH=\"/home/ssm-user/versions/node/v20.20.2/bin:$PATH\"",
              "export DEBIAN_FRONTEND=noninteractive",
              "if ! command -v aws >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y awscli; fi",
              "mkdir -p /home/ssm-user/deployments/${GITHUB_SHA}",
              "aws s3 cp s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/${GITHUB_SHA}.tar.gz /tmp/${GITHUB_SHA}.tar.gz",
              "find ${APP_DIR} -mindepth 1 -maxdepth 1 ! -name uploads -exec rm -rf {} +",
              "tar -xzf /tmp/${GITHUB_SHA}.tar.gz -C ${APP_DIR}",
              "mkdir -p ${APP_DIR}/uploads",
              "chown -R ssm-user:ssm-user ${APP_DIR}",
              "cd ${APP_DIR}",
              "npm ci --omit=dev",
              "rm -f /tmp/${GITHUB_SHA}.tar.gz"
            ]' \
            --max-concurrency "100%" \
            --max-errors "0" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          INSTANCE_IDS="${{ steps.instances.outputs.instance_ids }}"

          for i in {1..60}; do
            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[].Status' \
              --output text || true)

            echo "Deployment status: $STATUSES"

            if echo "$STATUSES" | grep -Eq 'Failed|TimedOut|Cancelled|Undeliverable|Terminated|AccessDenied|InvalidPlatform'; then
              echo "Deployment failed."
              exit 1
            fi

            EXPECTED=$(echo "$INSTANCE_IDS" | wc -w)
            ACTUAL=$(echo "$STATUSES" | wc -w)

            if [ "$ACTUAL" -eq "$EXPECTED" ] && \
               ! echo "$STATUSES" | grep -Eq 'Pending|InProgress|Delayed|Cancelling'; then
              echo "Deployment completed."
              break
            fi

            sleep 5
          done

      - name: Run database migration
        run: |
          FIRST_INSTANCE=$(echo "${{ steps.instances.outputs.instance_ids }}" | awk '{print $1}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$FIRST_INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Run database migration ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",
              "export PATH=\"/home/ssm-user/versions/node/v20.20.2/bin:$PATH\"",
              "set -a",
              ". /etc/devops-api.env",
              "set +a",
              "cd ${APP_DIR}",
              "npm run db:migrate"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Migration command: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$FIRST_INSTANCE" \
              --query 'Status' \
              --output text || true)

            echo "Migration status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if echo "$STATUS" | grep -Eq 'Failed|TimedOut|Cancelled|Undeliverable|Terminated|AccessDenied|InvalidPlatform'; then
              echo "Database migration failed."
              exit 1
            fi

            sleep 5
          done

          echo "Migration timed out."
          exit 1

      - name: Restart application
        run: |
          aws ssm send-command \
            --instance-ids ${{ steps.instances.outputs.instance_ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "Restart API ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",
              "sudo systemctl restart ${SERVICE_NAME}",
              "sleep 5",
              "sudo systemctl is-active --quiet ${SERVICE_NAME}",
              "curl -fsS http://127.0.0.1:3000/health"
            ]' \
            --max-concurrency "100%" \
            --max-errors "0"

      - name: Check ALB health
        run: |
          for i in {1..12}; do
            if curl -fsS http://devops-api-alb-526360884.us-east-2.elb.amazonaws.com/health; then
              echo
              echo "ALB health check passed."
              exit 0
            fi

            echo "Waiting for ALB..."
            sleep 5
          done

          echo "ALB health check failed."
          exit 1